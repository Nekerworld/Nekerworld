<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0B1727"/>
      <stop offset="1" stop-color="#08131E"/>
    </linearGradient>
    <linearGradient id="signal" x1="130" y1="0" x2="1070" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4CC9F0"/>
      <stop offset="0.55" stop-color="#7AA2F7"/>
      <stop offset="1" stop-color="#9D7CD8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8BA4C7" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .dim { fill:#8B9BB4; }
      .bright { fill:#EAF2FF; }
      .line { stroke:url(#signal); stroke-width:2; stroke-linecap:round; }
      .node { fill:#0B1727; stroke:#6EA8FE; stroke-width:1.5; }
      .pulse { fill:#7DD3FC; filter:url(#glow); }
      @keyframes fade { 0% {opacity:.35} 50% {opacity:1} 100% {opacity:.35} }
      .blink { animation: fade 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" stroke="#7AA2F7" stroke-opacity="0.20"/>

  <text x="600" y="126" class="sans bright" text-anchor="middle" font-size="48" font-weight="700" letter-spacing="1">YOONSUNG KIM</text>
  <text x="600" y="160" class="mono" fill="#9FB5D5" text-anchor="middle" font-size="17" letter-spacing="2">ELECTRONIC ENGINEERING × ARTIFICIAL INTELLIGENCE</text>

  <!-- main signal bus -->
  <line x1="170" y1="260" x2="1030" y2="260" class="line" opacity="0.58"/>

  <!-- nodes -->
  <g>
    <rect x="105" y="224" width="150" height="72" rx="12" class="node" zorder="2"/>
    <text x="180" y="253" class="mono bright" text-anchor="middle" font-size="15" font-weight="700">SENSING</text>
    <text x="180" y="278" class="mono dim" text-anchor="middle" font-size="12">Raw Data</text>
  </g>
  <g>
    <rect x="315" y="224" width="150" height="72" rx="12" class="node"/>
    <text x="390" y="253" class="mono bright" text-anchor="middle" font-size="15" font-weight="700">EMBEDDED</text>
    <text x="390" y="278" class="mono dim" text-anchor="middle" font-size="12">STM32 · ESP32</text>
  </g>
  <g>
    <rect x="525" y="224" width="150" height="72" rx="12" class="node"/>
    <text x="600" y="253" class="mono bright" text-anchor="middle" font-size="15" font-weight="700">CONTROL</text>
    <text x="600" y="278" class="mono dim" text-anchor="middle" font-size="12">MOTION · FUSION</text>
  </g>
  <g>
    <rect x="735" y="224" width="150" height="72" rx="12" class="node"/>
    <text x="810" y="253" class="mono bright" text-anchor="middle" font-size="15" font-weight="700">INTELLIGENCE</text>
    <text x="810" y="278" class="mono dim" text-anchor="middle" font-size="12">CV · DL · ML</text>
  </g>
  <g>
    <rect x="945" y="224" width="150" height="72" rx="12" class="node"/>
    <text x="1020" y="253" class="mono bright" text-anchor="middle" font-size="15" font-weight="700">PRODUCT</text>
    <text x="1020" y="278" class="mono dim" text-anchor="middle" font-size="12">WEB · CLOUD</text>
  </g>

  <!-- animated signal dots -->
  <circle r="5" cy="260" class="pulse">
    <animate attributeName="cx" values="255;315;465;525;675;735;885;945" keyTimes="0;.12;.27;.39;.55;.67;.83;1" dur="5.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;1;1;1;0" dur="5.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" cy="260" fill="#A78BFA" opacity=".75">
    <animate attributeName="cx" values="255;315;465;525;675;735;885;945" keyTimes="0;.12;.27;.39;.55;.67;.83;1" dur="5.4s" begin="-2.7s" repeatCount="indefinite"/>
  </circle>

  <!-- tiny engineering annotations -->
  <text x="285" y="248" class="mono dim" text-anchor="middle" font-size="10">DATA</text>
  <text x="495" y="248" class="mono dim" text-anchor="middle" font-size="10">STATE</text>
  <text x="705" y="248" class="mono dim" text-anchor="middle" font-size="10">FEATURE</text>
  <text x="915" y="248" class="mono dim" text-anchor="middle" font-size="10">OUTPUT</text>

  <text x="600" y="352" class="mono" fill="#B8C7DD" text-anchor="middle" font-size="16" letter-spacing="1.5">BUILDING INTELLIGENT SYSTEMS FROM CIRCUITS TO AI</text>
  <circle cx="429" cy="347" r="3" fill="#7DD3FC" class="blink"/>
  <circle cx="771" cy="347" r="3" fill="#A78BFA" class="blink"/>

  <text x="64" y="390" class="mono dim" font-size="11">HW → EMBEDDED → CONTROL → AI → SOFTWARE</text>
  <text x="1136" y="390" class="mono dim" text-anchor="end" font-size="11">github.com/Nekerworld</text>
</svg>
