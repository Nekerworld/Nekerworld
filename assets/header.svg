```xml
<svg
  width="1200"
  height="480"
  viewBox="0 0 1200 480"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Yoonsung Kim Engineering Constellation</title>
  <desc id="desc">
    A constellation connecting Embedded Systems, Robotics,
    Computer Vision, Artificial Intelligence and Software.
  </desc>

  <defs>
    <!-- Background -->
    <radialGradient id="space" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#101c36"/>
      <stop offset="45%" stop-color="#080f21"/>
      <stop offset="100%" stop-color="#030711"/>
    </radialGradient>

    <!-- Central glow -->
    <radialGradient id="centerGlow">
      <stop offset="0%" stop-color="#8ecaff" stop-opacity=".20"/>
      <stop offset="45%" stop-color="#4a8fd8" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#030711" stop-opacity="0"/>
    </radialGradient>

    <!-- Star glow -->
    <filter id="starGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shooting star gradient -->
    <linearGradient id="shootingTrail" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a8d8ff" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <!-- ================================ -->
  <!-- BACKGROUND                       -->
  <!-- ================================ -->

  <rect width="1200" height="480" rx="22" fill="url(#space)"/>
  <ellipse cx="600" cy="235" rx="430" ry="250" fill="url(#centerGlow)"/>

  <!-- ================================ -->
