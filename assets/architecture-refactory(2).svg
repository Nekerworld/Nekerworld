<svg width="1100" height="270" viewBox="0 0 1100 270" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="270" gradientUnits="userSpaceOnUse">
    <stop stop-color="#07111F"/>
    <stop offset="0.52" stop-color="#0B1727"/>
    <stop offset="1" stop-color="#08131E"/>
  </linearGradient>
  <linearGradient id="signal" x1="42" y1="0" x2="1058" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#4CC9F0"/>
    <stop offset="0.55" stop-color="#7AA2F7"/>
    <stop offset="1" stop-color="#9D7CD8"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#8BA4C7" stroke-opacity="0.05"/>
  </pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .mono { font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace; }
    .sans { font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    .dim { fill:#8B9BB4; }
    .bright { fill:#EAF2FF; }
    .line { stroke:url(#signal); stroke-width:1.5; stroke-linecap:round; }
    .node { fill:#0B1727; stroke:#6EA8FE; stroke-width:1.25; }
    .pulse { fill:#7DD3FC; filter:url(#glow); }
  </style>
</defs>

<rect width="1100" height="270" rx="18" fill="url(#bg)"/>
<rect width="1100" height="270" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="1098" height="268" rx="17" stroke="#7AA2F7" stroke-opacity="0.18"/>

<text x="48" y="42" class="sans bright" font-size="17" font-weight="700">Refactory</text>
<text x="48" y="65" class="mono dim" font-size="10.5" letter-spacing=".8">GITHUB · REVIEW MODES · AI CODE REVIEW · VISUALIZATION · REPORT</text>

<!-- signal layer behind cards -->
<g>
<line x1="192" y1="156" x2="252" y2="156" class="line" opacity="0.58"/><line x1="402" y1="156" x2="462" y2="156" class="line" opacity="0.58"/><line x1="612" y1="156" x2="672" y2="156" class="line" opacity="0.58"/><line x1="822" y1="156" x2="882" y2="156" class="line" opacity="0.58"/>
<circle r="4" cy="156" class="pulse">
  <animate attributeName="cx" values="192;252" dur="1.2s" begin="0.0s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.0s" repeatCount="indefinite"/>
</circle><circle r="4" cy="156" class="pulse">
  <animate attributeName="cx" values="402;462" dur="1.2s" begin="0.22s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.22s" repeatCount="indefinite"/>
</circle><circle r="4" cy="156" class="pulse">
  <animate attributeName="cx" values="612;672" dur="1.2s" begin="0.44s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.44s" repeatCount="indefinite"/>
</circle><circle r="4" cy="156" class="pulse">
  <animate attributeName="cx" values="822;882" dur="1.2s" begin="0.66s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.66s" repeatCount="indefinite"/>
</circle>
</g>

<!-- cards -->
<g>
  <rect x="42" y="120" width="150" height="72" rx="10" class="node"/>
  <text x="117.0" y="148" text-anchor="middle" class="mono bright" font-size="13" font-weight="700">GitHub PR</text>
  <text x="117.0" y="170" text-anchor="middle" class="mono dim" font-size="10">OAuth · Webhook</text>
</g><g>
  <rect x="252" y="120" width="150" height="72" rx="10" class="node"/>
  <text x="327.0" y="148" text-anchor="middle" class="mono bright" font-size="13" font-weight="700">리뷰 모드 선택</text>
  <text x="327.0" y="170" text-anchor="middle" class="mono dim" font-size="10">Clean · Optimize · Study</text>
</g><g>
  <rect x="462" y="120" width="150" height="72" rx="10" class="node"/>
  <text x="537.0" y="148" text-anchor="middle" class="mono bright" font-size="13" font-weight="700">AI 코드 리뷰</text>
  <text x="537.0" y="170" text-anchor="middle" class="mono dim" font-size="10">DeepSeek · Analysis</text>
</g><g>
  <rect x="672" y="120" width="150" height="72" rx="10" class="node"/>
  <text x="747.0" y="148" text-anchor="middle" class="mono bright" font-size="13" font-weight="700">점수화 · 시각화</text>
  <text x="747.0" y="170" text-anchor="middle" class="mono dim" font-size="10">Quality · Performance</text>
</g><g>
  <rect x="882" y="120" width="176" height="72" rx="10" class="node"/>
  <text x="970.0" y="148" text-anchor="middle" class="mono bright" font-size="13" font-weight="700">리포트 · 부분 리뷰</text>
  <text x="970.0" y="170" text-anchor="middle" class="mono dim" font-size="10">PDF · Inline Review</text>
</g>

<text x="550" y="232" text-anchor="middle" class="mono dim" font-size="10.5" letter-spacing=".55">
PR → REVIEW MODE → AI REVIEW → SCORE / VISUALIZATION → REPORT / INLINE REVIEW
</text>
</svg>