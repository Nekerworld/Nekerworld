name: Update language statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    paths:
      - scripts/language_stats.py
      - scripts/language_donut.py
      - .github/workflows/language-stats.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Build combined language graph
        env:
          GITHUB_PROFILE_USER: Nekerworld
          GH_STATS_TOKEN: ${{ secrets.LANGUAGE_STATS_TOKEN }}
        run: |
          python3 scripts/language_stats.py
          python3 scripts/language_donut.py
      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg assets/languages-donut.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update combined repository language statistics"
            git push
          fi
